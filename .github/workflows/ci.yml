name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install web and test dependencies
        run: python3 -m pip install -e '.[web,test,geometry]'
      - name: Offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Result refresh race checks
        run: node --test tests/js/*.test.cjs
      - name: Public-tree guard
        run: python3 scripts/check_public_tree.py
  portable-analysis:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install application with its analysis runtime
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 scripts/install_local.py --runtime "$RUNNER_TEMP/auto-lammps-runtime" --install-system-dependencies
          else
            python3 scripts/install_local.py --runtime "$RUNNER_TEMP/auto-lammps-runtime"
          fi
      - name: Analysis runtime diagnostics
        if: always()
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'auto-lammps-runtime'
          for name in ('analysis-check.json', 'analysis-check.stderr.txt'):
              path = root / name
              if path.exists():
                  print(name, path.read_text(errors='replace')[-6000:])
          PYCODE
      - name: Verify retained-output analysis
        run: '"$RUNNER_TEMP/auto-lammps-runtime/bin/python" -m unittest discover -s tests -p test_retained_analysis.py -v'
